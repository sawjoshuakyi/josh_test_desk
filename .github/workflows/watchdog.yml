name: watchdog

# Warns in the general Discord channel when a desk session's outputs are missing.
# 3:15 AM ET (AM desk), 5:50 PM ET (PM desk), 12:15 PM ET Sunday (NFL desk).
on:
  schedule:
    - cron: "15 8 * * *"
    - cron: "50 22 * * *"
    - cron: "15 17 * * 0"
  workflow_dispatch:
    inputs:
      session:
        default: "pm"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - name: Check
        run: |
          case "${{ github.event.schedule }}" in
            "15 8 * * *") s=am ;;
            "50 22 * * *") s=pm ;;
            "15 17 * * 0") s=nfl ;;
            *) s="${{ github.event.inputs.session || 'pm' }}" ;;
          esac
          python3 scripts/watchdog.py "$s"
