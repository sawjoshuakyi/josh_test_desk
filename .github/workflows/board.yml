name: model-board

# Builds the model board (fair prices, edges, Kelly stakes) before each desk session, and grades past boards.
# Times are UTC (Eastern + 5 in winter, + 4 in summer): AM board 12:35 / 1:05 / 1:25 AM ET, PM board 3:15 / 3:45 /
# 4:05 PM ET, Sunday NFL 9:35 / 10:05 / 10:25 AM ET. GitHub sometimes delays or drops scheduled runs, so each board has
# backup times; a backup exits at once when today's priced board is already in the repo (no credits spent).
on:
  schedule:
    - cron: "35 5 * * *"
    - cron: "5 6 * * *"
    - cron: "25 6 * * *"
    - cron: "15 20 * * *"
    - cron: "45 20 * * *"
    - cron: "5 21 * * *"
    - cron: "35 14 * * 0"
    - cron: "5 15 * * 0"
    - cron: "25 15 * * 0"
  workflow_dispatch:
    inputs:
      session:
        description: "am | pm | nfl"
        default: "pm"

permissions:
  contents: write

concurrency:
  group: model-board
  cancel-in-progress: false

jobs:
  board:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DISCORD_GENERAL_WEBHOOK: ${{ secrets.DISCORD_GENERAL_WEBHOOK }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Pick session
        id: s
        run: |
          case "${{ github.event.schedule }}" in
            "35 5 * * *"|"5 6 * * *"|"25 6 * * *") s=am ;;
            "15 20 * * *"|"45 20 * * *"|"5 21 * * *") s=pm ;;
            "35 14 * * 0"|"5 15 * * 0"|"25 15 * * 0") s=nfl ;;
            *) s="${{ github.event.inputs.session || 'pm' }}" ;;
          esac
          echo "session=$s" >> "$GITHUB_OUTPUT"
          f="boards/$(TZ=America/Toronto date +%F)-$s.json"
          if [ "${{ github.event_name }}" = "schedule" ] && [ -f "$f" ] && python3 -c "import json,sys; b=json.load(open('$f')); sys.exit(0 if b.get('odds_source')=='the-odds-api' and not b.get('errors') else 1)"; then
            echo "skip=1" >> "$GITHUB_OUTPUT"; echo "$f already built with prices — backup run skipped"
          fi
      - name: Update NBA box scores (for grading)
        if: steps.s.outputs.skip != '1'
        run: python3 -c "import datetime as d; from desk import config; from desk.nba import data; print(data.update(config.et_today() - d.timedelta(days=1)))" || echo "NBA box-score update failed; grading may lag"
      - name: Build board
        if: steps.s.outputs.skip != '1'
        run: python3 scripts/board.py ${{ steps.s.outputs.session }} 2>&1 | tee /tmp/board.log; test ${PIPESTATUS[0]} -eq 0 || { mkdir -p reports; tail -60 /tmp/board.log > reports/board_error_${{ steps.s.outputs.session }}.txt; exit 1; }
      - name: Grade past boards (NFL props need the latest nflverse stats)
        if: always() && steps.s.outputs.skip != '1'
        run: |
          python3 -c "from desk.nfl import data; data.download()" || echo "nflverse download failed; NFL props stay ungraded this run"
          python3 scripts/grade_board.py
      - name: Commit
        if: always() && steps.s.outputs.skip != '1'
        run: scripts/commit.sh "Model board $(date -u +%F) ${{ steps.s.outputs.session }}" boards data reports
