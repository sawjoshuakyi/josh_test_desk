name: live-tracker

# Times are UTC (shown here in Eastern Standard Time; one hour later on the clock during daylight saving).
# Each run checks every 60 seconds for up to ~5h45m and stops early once every leg is settled.
# Follow-on runs of the same session wait for the earlier run, then resume from its saved state.
#
#   am  -> legs/<date>-am.json   soccer + tennis (desk runs 1:47 AM ET)
#   nfl -> legs/<date>-nfl.json  Sunday NFL slate (desk runs 10:41 AM ET Sundays)
#   pm  -> legs/<date>-pm.json   NBA + prime-time NFL (desk runs 4:27 PM ET)
on:
  schedule:
    - cron: "0 8 * * *"     # am   3:00 AM ET
    - cron: "50 13 * * *"   # am   8:50 AM ET follow-on
    - cron: "40 19 * * *"   # am   2:40 PM ET follow-on
    - cron: "50 17 * * 0"   # nfl  12:50 PM ET Sundays (1 PM kickoffs)
    - cron: "40 23 * * 0"   # nfl  6:40 PM ET Sundays follow-on (late games, Sunday Night Football)
    - cron: "50 23 * * *"   # pm   6:50 PM ET
    - cron: "30 3 * * *"    # pm   10:30 PM ET follow-on (late West Coast games)
  workflow_dispatch:
    inputs:
      session:
        description: "am, nfl or pm"
        required: true
        default: "pm"

concurrency:
  group: live-tracker-${{ github.event.inputs.session || ((github.event.schedule == '50 17 * * 0' || github.event.schedule == '40 23 * * 0') && 'nfl') || ((github.event.schedule == '50 23 * * *' || github.event.schedule == '30 3 * * *') && 'pm') || 'am' }}
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    env:
      SESSION: ${{ github.event.inputs.session || ((github.event.schedule == '50 17 * * 0' || github.event.schedule == '40 23 * * 0') && 'nfl') || ((github.event.schedule == '50 23 * * *' || github.event.schedule == '30 3 * * *') && 'pm') || 'am' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved alerts (so restarts never repeat a notification)
        uses: actions/cache/restore@v4
        with:
          path: state-*.json
          key: tracker-state-${{ env.SESSION }}-${{ github.run_id }}
          restore-keys: tracker-state-${{ env.SESSION }}-
      - name: Track today's legs
        env:
          DISCORD_LIVE_WEBHOOK: ${{ secrets.DISCORD_LIVE_WEBHOOK }}
          MAX_MINUTES: "345"
          POLL_SECONDS: "60"
        run: |
          # Evening (pm) runs can start after midnight while they wait for an earlier run: count anything before
          # 8 AM ET as the previous day's slate.
          if [ "$SESSION" = "pm" ]; then D=$(TZ=America/Toronto date -d '-8 hours' +%F); else D=$(TZ=America/Toronto date +%F); fi
          F="legs/$D-$SESSION.json"
          echo "Session: $SESSION  File: $F"
          if [ -f "$F" ]; then
            STATE_FILE="state-$D-$SESSION.json" python3 tracker.py "$F"
          else
            echo "No legs file $F - nothing to track."
          fi
      - name: Save alerts state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-*.json
          key: tracker-state-${{ env.SESSION }}-${{ github.run_id }}
