name: live-tracker

# Times are UTC (shown here in Eastern Standard Time; one hour later on the clock during daylight saving).
# Each run checks every 60 seconds for up to ~5h45m and stops early once every leg is settled.
# The follow-on runs wait for the earlier run to finish, then resume from its saved state.
on:
  schedule:
    - cron: "5 14 * * *"    # 9:05 AM ET  -> legs/<date>-am.json (soccer, tennis, Sunday NFL), after the AM desk
    - cron: "5 19 * * *"    # 2:05 PM ET  -> am follow-on (late soccer, Sunday late/night NFL)
    - cron: "50 23 * * *"   # 6:50 PM ET  -> legs/<date>-pm.json (NBA, prime-time NFL)
    - cron: "30 3 * * *"    # 10:30 PM ET -> pm follow-on (late West Coast games)
  workflow_dispatch:
    inputs:
      session:
        description: "am or pm"
        required: true
        default: "pm"

# Never run two trackers at once; a second run waits and resumes from saved state.
concurrency:
  group: live-tracker
  cancel-in-progress: false

jobs:
  track:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore saved alerts (so restarts never repeat a notification)
        uses: actions/cache/restore@v4
        with:
          path: state-*.json
          key: tracker-state-${{ github.run_id }}
          restore-keys: tracker-state-
      - name: Track today's legs
        env:
          DISCORD_LIVE_WEBHOOK: ${{ secrets.DISCORD_LIVE_WEBHOOK }}
          MAX_MINUTES: "345"
          POLL_SECONDS: "60"
        run: |
          D=$(TZ=America/Toronto date +%F)
          H=$((10#$(date -u +%H)))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            S="${{ github.event.inputs.session }}"
          elif [ $H -ge 11 ] && [ $H -le 20 ]; then S=am; else S=pm; fi
          F="legs/$D-$S.json"
          if [ -f "$F" ]; then python3 tracker.py "$F"; else echo "No legs file $F - nothing to track."; fi
      - name: Save alerts state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-*.json
          key: tracker-state-${{ github.run_id }}
