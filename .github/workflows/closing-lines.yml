name: closing-lines

# Every 15 minutes: snapshot the odds of any priced event starting in the next ~35 minutes (closing line, for CLV).
# Uses no API credits when nothing is about to start.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: closing-lines
  cancel-in-progress: false

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/close.py
      - run: scripts/commit.sh "Closing lines $(date -u +%FT%H:%M)" data/snapshots
