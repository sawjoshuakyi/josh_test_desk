name: research

# Runs backtests that need data sources reachable only from GitHub's servers, then commits the
# results to reports/. Trigger by changing research/run.txt (or Run workflow by hand).
on:
  push:
    paths: ["research/run.txt"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pandas numpy scipy openpyxl
      - name: Tennis model vs Pinnacle closing odds
        run: python3 scripts/backtest_tennis_market.py
      - name: Commit results
        run: |
          git config user.name "desk-bot"
          git config user.email "desk-bot@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "Research results $(date -u +%F)"
          git pull --rebase -q origin main && git push -q origin HEAD:main
